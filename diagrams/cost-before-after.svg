<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif">
  <!-- Explicit background so the chart reads identically in GitHub dark mode -->
  <rect x="0" y="0" width="1000" height="330" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <text x="30" y="42" font-size="21" font-weight="700" fill="#1a1a1a">Monthly idle cost — measured before vs. after ADR-013</text>
  <text x="30" y="66" font-size="13" fill="#57606a">Steady-state, from AWS Cost Explorer daily data (Jul 30 – Aug 2 baseline). Bars share one scale.</text>

  <!-- BEFORE bar: $81.6/mo ≈ full width (900px @ ~11.03 px/$) -->
  <text x="30" y="110" font-size="15" font-weight="700" fill="#1a1a1a">Before</text>
  <text x="960" y="110" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="end">~$82 / month</text>
  <g>
    <!-- Aurora idle floor 43.20 -->
    <rect x="30"  y="120" width="477" height="46" fill="#527FFF"/>
    <!-- NAT 32.40 -->
    <rect x="507" y="120" width="357" height="46" fill="#ED7100"/>
    <!-- EIP 3.60 -->
    <rect x="864" y="120" width="40"  height="46" fill="#fb8f44"/>
    <!-- IO 1.80 -->
    <rect x="904" y="120" width="20"  height="46" fill="#8fb3ff"/>
    <!-- SM + storage 0.58 -->
    <rect x="924" y="120" width="6.4" height="46" fill="#DD344C"/>
    <text x="45"  y="148" font-size="13" fill="#ffffff" font-weight="600">Aurora idle floor (min 0.5 ACU) $43.20</text>
    <text x="522" y="148" font-size="13" fill="#ffffff" font-weight="600">NAT gateway $32.40</text>
  </g>
  <text x="960" y="182" font-size="11" fill="#57606a" text-anchor="end">↑ EIP $3.60 · storage IO $1.80 · Secrets Mgr + storage $0.58</text>

  <!-- AFTER bar: $0.58/mo → ~6px sliver on the same scale -->
  <text x="30" y="222" font-size="15" font-weight="700" fill="#1a1a1a">After</text>
  <text x="960" y="222" font-size="15" font-weight="700" fill="#166534" text-anchor="end">~$0.58 / month</text>
  <rect x="30" y="232" width="6.4" height="46" fill="#166534"/>
  <line x1="40" y1="255" x2="150" y2="255" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="158" y="252" font-size="12" fill="#374151">that sliver, to scale: Secrets Manager $0.40 + Aurora storage $0.18</text>
  <text x="158" y="270" font-size="12" fill="#374151">everything else sits inside always-free tiers · ~$0.07 per demo run</text>

  <text x="30" y="311" font-size="14" font-weight="700" fill="#166534">≈ 99% reduction — deleted the NAT + Elastic IP (Lambda split, ADR-013) and the idle ACU floor (scale-to-zero)</text>
</svg>
